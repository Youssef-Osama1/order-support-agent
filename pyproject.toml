[project]
name = "ai-project-template"
version = "0.1.0"
description = "Layered async FastAPI template for LLM applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "openai==3.24.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "ipykernel==7.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]
